<!doctype html>
<html lang="zh-Hant-TW" data-layout="landscape" data-scene="cover">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的電腦</title>
<meta name="description" content="一步步填寫電腦硬體，算出所需的最小電量與最大電量。">
<meta name="theme-color" content="#070c22">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<script>
(function () {
  var r = document.documentElement;
  r.setAttribute('data-layout', innerWidth >= innerHeight ? 'landscape' : 'portrait');
  r.setAttribute('data-device', window.matchMedia && matchMedia('(pointer: coarse)').matches ? 'touch' : 'mouse');
})();
</script>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset=".5" stop-color="#f3d48b"/>
      <stop offset="1" stop-color="#b9862f"/>
    </linearGradient>
    <radialGradient id="gCore">
      <stop offset="0" stop-color="#b8f0ff"/>
      <stop offset=".45" stop-color="#4f86ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#4f86ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gChip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22357a"/>
      <stop offset="1" stop-color="#0d1640"/>
    </linearGradient>
    <linearGradient id="gGaugeMin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8f0ff"/>
      <stop offset="1" stop-color="#4f86ff"/>
    </linearGradient>
    <linearGradient id="gGaugeMax" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1c4"/>
      <stop offset="1" stop-color="#e7a43a"/>
    </linearGradient>
    <symbol id="emblem" viewBox="0 0 400 400">
      <circle cx="200" cy="200" r="196" fill="url(#gCore)" opacity=".55"/>
      <g class="ring ring-a">
        <circle cx="200" cy="200" r="184" fill="none" stroke="url(#gGold)" stroke-width="2" stroke-dasharray="3 11"/>
        <path d="M200 8 l8 12 -8 12 -8 -12z M200 368 l8 12 -8 12 -8 -12z M8 200 l12 -8 12 8 -12 8z M368 200 l12 -8 12 8 -12 8z" fill="url(#gGold)"/>
      </g>
      <g class="ring ring-b">
        <circle cx="200" cy="200" r="156" fill="none" stroke="url(#gGold)" stroke-width="4" stroke-dasharray="150 18 8 18"/>
      </g>
      <g class="ring ring-c">
        <polygon points="200,72 311,136 311,264 200,328 89,264 89,136" fill="none" stroke="url(#gGold)" stroke-width="3" opacity=".85"/>
        <polygon points="200,92 293,146 293,254 200,308 107,254 107,146" fill="none" stroke="#7fe3ff" stroke-width="1.5" opacity=".5"/>
      </g>
      <g stroke="url(#gGold)" stroke-width="5" stroke-linecap="round">
        <path d="M164 140v-22M182 140v-22M200 140v-22M218 140v-22M236 140v-22"/>
        <path d="M164 260v22M182 260v22M200 260v22M218 260v22M236 260v22"/>
        <path d="M140 164h-22M140 182h-22M140 200h-22M140 218h-22M140 236h-22"/>
        <path d="M260 164h22M260 182h22M260 200h22M260 218h22M260 236h22"/>
      </g>
      <rect x="140" y="140" width="120" height="120" rx="18" fill="url(#gChip)" stroke="url(#gGold)" stroke-width="5"/>
      <rect x="154" y="154" width="92" height="92" rx="10" fill="none" stroke="#7fe3ff" stroke-width="1.5" opacity=".6"/>
      <path class="bolt" d="M210 158 L174 208 H198 L188 244 L228 190 H204 Z" fill="url(#gGold)"/>
    </symbol>
  </defs>
</svg>

<div class="loader" id="loader">
  <div class="loader-inner">
    <svg class="loader-emblem" viewBox="0 0 400 400"><use href="#emblem"/></svg>
    <div class="loader-track"><div class="loader-bar" id="loaderBar"></div></div>
    <p class="loader-text">載入中 <span id="loaderPct">0%</span></p>
  </div>
</div>

<div class="viewport">
  <div class="backdrop">
    <div class="bd-glow"></div>
    <div class="bd-grid"></div>
    <div class="bd-stars" id="stars"></div>
    <div class="bd-orbit"></div>
  </div>

  <div class="stage" id="stage">

    <section class="scene scene-cover is-active" data-scene="cover">
      <div class="cover-emblem rise" style="--i:0">
        <svg viewBox="0 0 400 400"><use href="#emblem"/></svg>
      </div>
      <div class="cover-text">
        <p class="cover-en rise" style="--i:1">MY DEVICE</p>
        <h1 class="cover-title rise" style="--i:2">我的電腦</h1>
        <p class="cover-sub rise" style="--i:3">一步步填寫硬體・試算最小與最大電量</p>
      </div>
      <button class="btn-main rise" style="--i:4" type="button" id="btnStart">
        <span class="btn-ico"><i class="bi bi-play-fill"></i></span><span class="btn-label">開始填寫</span>
      </button>
      <button class="link-btn rise" style="--i:5" type="button" id="btnClear" hidden><i class="bi bi-arrow-counterclockwise"></i>清除上次的答案，重新填寫</button>
      <p class="cover-note rise" style="--i:6"><i class="bi bi-shield-check"></i>每一題都可以略過，答案只存在你的瀏覽器裡</p>
    </section>

    <section class="scene scene-wizard" data-scene="wizard">
      <div class="wz-top">
        <p class="wz-step" id="wzStep"></p>
        <ol class="wz-nodes" id="wzNodes"></ol>
      </div>
      <div class="wz-main" id="wzMain">
        <h2 class="wz-q" id="wzQ"></h2>
        <p class="wz-crumb" id="wzCrumb"></p>
        <div class="wz-help" id="wzHelp"></div>
        <label class="wz-search" id="wzSearchWrap">
          <i class="bi bi-search"></i>
          <input type="search" id="wzSearch" autocomplete="off">
        </label>
        <div class="wz-body" id="wzBody"></div>
      </div>
      <div class="scene-foot wz-foot">
        <button class="btn-sub" type="button" id="wzBack"><i class="bi bi-chevron-left"></i>上一步</button>
        <button class="btn-sub" type="button" id="wzSkip"><i class="bi bi-skip-forward-fill"></i>略過這題</button>
        <button class="btn-main" type="button" id="wzNext">
          <span class="btn-ico"><i class="bi bi-chevron-right"></i></span><span class="btn-label" id="wzNextLabel">下一步</span>
        </button>
      </div>
    </section>

    <section class="scene scene-result" data-scene="result">
      <div class="scene-head rise" style="--i:0">
        <p class="head-en">POWER REPORT</p>
        <h2 class="head-title">電力報告</h2>
      </div>
      <div class="res-wrap">
        <div class="res-gauges">
          <div class="gauge g-min rise" style="--i:1">
            <svg viewBox="0 0 300 300">
              <circle class="g-track" cx="150" cy="150" r="128"/>
              <circle class="g-fill" id="gMin" cx="150" cy="150" r="128" stroke="url(#gGaugeMin)"/>
            </svg>
            <div class="g-center">
              <p class="g-label">最小電量</p>
              <p class="g-value"><span id="vMin">0</span><small>W</small></p>
              <p class="g-cap">待機・輕度使用</p>
            </div>
          </div>
          <div class="gauge g-max rise" style="--i:2">
            <svg viewBox="0 0 300 300">
              <circle class="g-track" cx="150" cy="150" r="128"/>
              <circle class="g-fill" id="gMax" cx="150" cy="150" r="128" stroke="url(#gGaugeMax)"/>
            </svg>
            <div class="g-center">
              <p class="g-label">最大電量</p>
              <p class="g-value"><span id="vMax">0</span><small>W</small></p>
              <p class="g-cap">所有零件同時滿載</p>
            </div>
          </div>
        </div>
        <div class="res-cards">
          <div class="card rise" style="--i:3">
            <p class="card-label">電力評級</p>
            <p class="card-stars" id="rStars"></p>
            <p class="card-big" id="rTitle"></p>
          </div>
          <div class="card card-rec rise" style="--i:4">
            <p class="card-label" id="recLabel">建議電源供應器</p>
            <p class="card-big"><span id="recValue">0</span><small>W</small></p>
            <p class="card-note" id="recNote"></p>
          </div>
          <div class="card card-daily rise" style="--i:5">
            <p class="card-label">每天使用 <b id="hoursOut">8</b> 小時</p>
            <input type="range" min="1" max="24" step="1" value="8" id="hours" aria-label="每天使用時數">
            <p class="card-note" id="dailyOut"></p>
          </div>
        </div>
        <div class="res-break rise" style="--i:6">
          <div class="break-head">
            <p class="break-title">耗電明細</p>
            <p class="break-legend"><span class="lg-min"></span>最小<span class="lg-max"></span>最大</p>
          </div>
          <ul class="break-list" id="breakList"></ul>
          <p class="break-note" id="breakNote">最大電量是所有零件同時滿載的理論值，實際使用通常介於兩者之間。數值為估算，僅供參考。</p>
        </div>
      </div>
      <div class="scene-foot res-foot">
        <button class="btn-sub" type="button" id="btnEdit"><i class="bi bi-pencil-square"></i>修改答案</button>
        <button class="btn-sub" type="button" data-go="cover"><i class="bi bi-house-door"></i>回到首頁</button>
      </div>
    </section>

  </div>
</div>

<header class="hud">
  <button class="hud-brand" type="button" id="hudHome" aria-label="回到首頁">
    <svg class="hud-mark" viewBox="0 0 400 400"><use href="#emblem"/></svg>
    <span class="hud-brand-text">我的電腦</span>
  </button>
  <div class="hud-right">
    <button class="hud-btn" type="button" id="hudFull" aria-label="全螢幕" title="全螢幕"><i class="bi bi-arrows-fullscreen"></i></button>
  </div>
</header>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
